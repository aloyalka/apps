plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zag.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zag.tvhome'
        minSdk 28
        targetSdk 28
        // Each build gets a higher number, so a new APK installs over the old one.
        versionCode((System.getenv('APP_VERSION_CODE') ?: '1') as Integer)
        versionName "1.0.${System.getenv('APP_VERSION_CODE') ?: '0'}"
    }

    signingConfigs {
        release {
            // Shared key for every app in this repo: lets updates install over older versions.
            storeFile file('../../../signing/release.jks')
            storePassword 'tvhome123'
            keyAlias 'tvhome'
            keyPassword 'tvhome123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
